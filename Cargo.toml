[package]
name = "shellune"
version = "0.4.12"
edition = "2024"
rust-version = "1.99"
description = "A modern terminal for local shells, SSH, and SFTP."
license = "GPL-3.0-only"
publish = false
default-run = "shellune"

[features]
# Builds the test-only flood program in src/bin/shellune-flood.rs. Everything the
# interrupt tests need is in it, so a build without this feature - including every
# release build - contains no test program at all.
test-support = ["dep:libc"]
# Builds the hidden-window capture probe in src/app/capture.rs (R1, R11). It is off
# by default: a normal build, let alone a release artifact, contains no capture entry,
# no scenario fixture and no PrintWindow call.
# The probe also builds the serial crate in-memory port double: a serial shot has no
# device behind it, and a fixture port is the only way to show a port list without one.
ui-capture = ["dep:serde_json", "shellune-serial/test-support"]

[[bin]]
name = "shellune-flood"
path = "src/bin/shellune-flood.rs"
# Off unless the feature is asked for: the helper exists for the integration tests,
# not for users, so it is never in a release artifact.
required-features = ["test-support"]

# tests/desktop_native.rs is the `native` test of shellune-desktop: that crate declares
# the same file as its own test target, which is where it belongs, since it drives only
# that crate's API. Cargo would otherwise also register it here as an integration test
# of this package and run every case a second time; `test = false` keeps the single
# registration without moving the file.
[[test]]
name = "desktop_native"
path = "tests/desktop_native.rs"
test = false

[dependencies]
gpui = "=0.2.2"
shellune-core = { path = "crates/core" }
shellune-ssh = { path = "crates/ssh" }
shellune-storage = { path = "crates/storage" }
# WebDAV sync of the portable data file (settings, state, conflicts).
shellune-sync = { path = "crates/sync" }
shellune-terminal = { path = "crates/terminal" }
# Self-update: the release manifest, signed downloads and the install routes.
shellune-update = { path = "crates/update" }
# The RDP/VNC sessions a desktop pane shows (R18-R20, R23). Both clients are part
# of that crate and link no protocol library; the same crate is what the native
# tests drive directly.
shellune-desktop = { path = "crates/desktop" }
# The serial ports a serial terminal holds open (R17, R21). The tests drive the same
# session over an in-memory port; that half is behind the crate's test-support
# feature and stays in the dev-dependencies below.
shellune-serial = { path = "crates/serial" }
# A rendered frame is handed to GPUI as an image, which is the only way a window
# draws a framebuffer pixel by pixel. The version is the one GPUI itself uses, so
# there is one image crate in the graph.
image = "0.25.1"
# Only the capture probe reports machine-readable results; the feature pulls it in.
serde_json = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
# The custom title bar drives the window through the system: the caption starts the
# native move loop, and the window buttons send the system's own commands. The
# test-only flood program also uses it to ignore Ctrl+C. The capture probe reads a
# window's client area back through GDI and PrintWindow, the latter declared under
# Storage::Xps in Windows Sys.
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_Console",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
# The window handle the title bar sends those commands to.
raw-window-handle = "0.6"

[target.'cfg(unix)'.dependencies]
# The same no-op Ctrl+C handler on Unix is one signal() call.
libc = { version = "0.2.191", optional = true }

[dev-dependencies]
# The GPUI test harness (TestAppContext / VisualTestContext) is behind this feature.
gpui = { version = "=0.2.2", features = ["test-support"] }
# The integration tests drive a real PTY, so they build the commands themselves.
portable-pty = { workspace = true }
# The host-storage integration tests read the written document as JSON.
serde_json = { workspace = true }
# The SSH tests drive a real OpenSSH server and scripted sessions, which the crate
# only builds for tests.
shellune-ssh = { path = "crates/ssh", features = ["test-support"] }
# The native desktop tests drive the RDP/VNC shim directly, including a scripted
# VNC peer and the deliberately panicking callback.
shellune-desktop = { path = "crates/desktop" }
# The serial tests drive a real SerialSession - reader, writer, bounded queue, close -
# over the in-memory port pair the crate only builds for tests.
shellune-serial = { path = "crates/serial", features = ["test-support"] }
# The window's sync tests run against the crate's in-process WebDAV server.
shellune-sync = { path = "crates/sync", features = ["test-support"] }
# The window's update tests run against the crate's loopback HTTP server and sign
# their packages with its throwaway keys.
shellune-update = { path = "crates/update", features = ["test-support"] }

[build-dependencies]
embed-resource = "3.0.12"

[workspace]
members = [
    "crates/core",
    "crates/desktop",
    "crates/serial",
    "crates/ssh",
    "crates/storage",
    "crates/sync",
    "crates/terminal",
    "crates/update",
]
# The patched third-party crates are dependencies, not members of this workspace.
exclude = ["vendor"]
resolver = "3"

[workspace.package]
version = "0.4.12"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"

[workspace.dependencies]
alacritty_terminal = "0.26.0"
# The SSH protocol itself. `ring` is the crypto backend: it needs no CMake, and
# `rsa` keeps RSA keys usable for the servers that still only offer them.
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa"] }
# The SFTP client: directory listing, metadata and file operations over the same
# russh connection the shell uses.
russh-sftp = { version = "3.0.1", default-features = false }
portable-pty = "0.9.0"
# The scrollback and command-block search: literal queries are escaped with it, and
# expression queries are compiled with it instead of a hand-written parser.
regex = "1.13.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
thiserror = "2.0.12"
# "fs" is for the transfer tasks: they read and write local files in fixed chunks
# beside the socket work instead of blocking the SSH runtime on a file system call.
tokio = { version = "1.53.1", features = ["fs", "io-util", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.11.0", features = ["v4", "serde"] }
zeroize = "1.8.1"

# xattr 0.2.3 (pulled in by gpui through zed-async-tar) names libc::ENOATTR on
# Linux, which current libc releases no longer export; see vendor/README.md.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
# The capture tool needs the rendered frame itself. The patch only exposes a
# CPU readback of the DirectX back buffer; it does not change rendering.
gpui = { path = "vendor/gpui" }

[profile.release]
strip = "symbols"