[package]
name = "shellune"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A modern terminal for local shells, SSH, and SFTP."
license = "GPL-3.0-only"
publish = false
default-run = "shellune"

[dependencies]
gpui = "=0.2.2"
shellune-core = { path = "crates/core" }
shellune-terminal = { path = "crates/terminal" }

[dev-dependencies]
# The GPUI test harness (TestAppContext / VisualTestContext) is behind this feature.
gpui = { version = "=0.2.2", features = ["test-support"] }
# The integration tests drive a real PTY, so they build the commands themselves.
portable-pty = { workspace = true }

[workspace]
members = ["crates/core", "crates/terminal"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"

[workspace.dependencies]
alacritty_terminal = "0.26.0"
portable-pty = "0.9.0"
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.12"
uuid = { version = "1.11.0", features = ["v4", "serde"] }
zeroize = "1.8.1"

[profile.release]
strip = "symbols"
