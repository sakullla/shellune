[package]
name = "shellune"
version = "0.2.2"
edition = "2024"
rust-version = "1.99"
description = "A modern terminal for local shells, SSH, and SFTP."
license = "GPL-3.0-only"
publish = false
default-run = "shellune"

[features]
# Builds the test-only flood program in src/bin/shellune-flood.rs. Everything the
# interrupt tests need is in it, so a build without this feature - including every
# release build - contains no test program at all.
test-support = ["dep:windows-sys", "dep:libc"]

[[bin]]
name = "shellune-flood"
path = "src/bin/shellune-flood.rs"
# Off unless the feature is asked for: the helper exists for the integration tests,
# not for users, so it is never in a release artifact.
required-features = ["test-support"]

[dependencies]
gpui = "=0.2.2"
shellune-core = { path = "crates/core" }
shellune-ssh = { path = "crates/ssh" }
shellune-storage = { path = "crates/storage" }
shellune-terminal = { path = "crates/terminal" }

[target.'cfg(windows)'.dependencies]
# The test-only flood program has to be able to ignore Ctrl+C, which is a console
# call. Optional, because only that program uses it.
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"], optional = true }

[target.'cfg(unix)'.dependencies]
# The same no-op Ctrl+C handler on Unix is one signal() call.
libc = { version = "0.2.191", optional = true }

[dev-dependencies]
# The GPUI test harness (TestAppContext / VisualTestContext) is behind this feature.
gpui = { version = "=0.2.2", features = ["test-support"] }
# The integration tests drive a real PTY, so they build the commands themselves.
portable-pty = { workspace = true }
# The host-storage integration tests read the written document as JSON.
serde_json = { workspace = true }
# The SSH tests drive a real OpenSSH server and scripted sessions, which the crate
# only builds for tests.
shellune-ssh = { path = "crates/ssh", features = ["test-support"] }

[build-dependencies]
embed-resource = "3.0.12"

[workspace]
members = ["crates/core", "crates/ssh", "crates/storage", "crates/terminal"]
# The patched third-party crates are dependencies, not members of this workspace.
exclude = ["vendor"]
resolver = "3"

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"

[workspace.dependencies]
alacritty_terminal = "0.26.0"
# The SSH protocol itself. `ring` is the crypto backend: it needs no CMake, and
# `rsa` keeps RSA keys usable for the servers that still only offer them.
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa"] }
# The SFTP client: directory listing, metadata and file operations over the same
# russh connection the shell uses.
russh-sftp = { version = "3.0.1", default-features = false }
portable-pty = "0.9.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
thiserror = "2.0.12"
# "fs" is for the transfer tasks: they read and write local files in fixed chunks
# beside the socket work instead of blocking the SSH runtime on a file system call.
tokio = { version = "1.53.1", features = ["fs", "io-util", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.11.0", features = ["v4", "serde"] }
zeroize = "1.8.1"

# xattr 0.2.3 (pulled in by gpui through zed-async-tar) names libc::ENOATTR on
# Linux, which current libc releases no longer export; see vendor/README.md.
[patch.crates-io]
xattr = { path = "vendor/xattr" }

[profile.release]
strip = "symbols"
