[package]
name = "shellune"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A modern terminal for local shells, SSH, and SFTP."
license = "GPL-3.0-only"
publish = false
default-run = "shellune"

[dependencies]
gpui = "=0.2.2"
shellune-core = { path = "crates/core" }
shellune-ssh = { path = "crates/ssh" }
shellune-storage = { path = "crates/storage" }
shellune-terminal = { path = "crates/terminal" }

[dev-dependencies]
# The GPUI test harness (TestAppContext / VisualTestContext) is behind this feature.
gpui = { version = "=0.2.2", features = ["test-support"] }
# The integration tests drive a real PTY, so they build the commands themselves.
portable-pty = { workspace = true }
# The host-storage integration tests read the written document as JSON.
serde_json = { workspace = true }
# The SSH tests drive a real OpenSSH server, started by the crate's own harness.
shellune-ssh = { path = "crates/ssh", features = ["test-server"] }

[workspace]
members = ["crates/core", "crates/ssh", "crates/storage", "crates/terminal"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"

[workspace.dependencies]
alacritty_terminal = "0.26.0"
# The SSH protocol itself. `ring` is the crypto backend: it needs no CMake, and
# `rsa` keeps RSA keys usable for the servers that still only offer them.
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa"] }
portable-pty = "0.9.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
thiserror = "2.0.12"
tokio = { version = "1.53.1", features = ["io-util", "net", "rt", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.11.0", features = ["v4", "serde"] }
zeroize = "1.8.1"

[profile.release]
strip = "symbols"
