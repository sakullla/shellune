[package]
name = "shellune-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Versioned, atomic host storage for Shellune."
publish = false

[dependencies]
# The portable data file (backup and sync): the saved passwords it may carry are
# sealed with AES-256-GCM under a key derived from the user's passphrase with
# Argon2id. Both match the versions already in the lock file.
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
base64 = "0.22.1"
# The salt and the nonce of a sealed block come from the operating system.
getrandom = "0.4.3"
# The system credential store: Windows Credential Manager, the macOS keychain, and the
# Secret Service on Linux (through zbus, pure Rust, so no system library is needed).
keyring = "4.2"
shellune-core = { path = "../core" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
# Wipes the derived key and the decrypted passwords once they are used.
zeroize = { workspace = true }

# Device-local biometric and system user verification (R3, R4). Every crate
# below is already in the lock file through the GPUI and keyring dependency
# trees, so no new package enters the graph.
[target.'cfg(target_os = "macos")'.dependencies]
# LocalAuthentication (LAContext): the system's own biometric verification.
objc2 = "0.6.5"
# NSString (the localized reason the prompt shows) and NSError (the failure
# codes it reports).
objc2-foundation = "0.3.2"
# The reply block `evaluatePolicy:localizedReason:reply:` takes.
block2 = "0.6.2"
# The keychain access control (biometryCurrentSet) that ties the vault's
# local unseal secret to the enrolled biometric set.
security-framework = "3.7.0"

[target.'cfg(target_os = "windows")'.dependencies]
# Windows Hello user consent for desktop windows: the UserConsentVerifier the
# interop interface verifies through, the COM apartment its activation needs,
# and the window handle the prompt is parented to. The version is the one
# already locked for the other Windows targets.
windows = { version = "0.62.2", features = [
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_UI_Input_KeyboardAndMouse",
] }
# The async operation type those calls return, so the prompt can be waited
# for on the calling thread.
windows-future = "0.3.2"
