[package]
name = "shellune-desktop"
description = "Self-implemented RDP and VNC sessions behind one small client API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
# Both protocols are implemented in Rust (src/rdp, src/vnc). The crate builds no C,
# links no protocol library and has no build script: the diagnostics names are
# ordinary functions in src/lib.rs.

[dependencies]
polling = "3.11.0"
# TLS is the generic transport the RDP client establishes before its own MCS and
# security layers; the protocol itself is in src/rdp. rustls is the same stack the
# SSH client already links, so no new cryptography implementation enters the build.
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring", "tls12", "logging"] }
# SHA-256 is the certificate fingerprint and the CredSSP pubkey binding; HMAC-MD5
# and MD5 are the NTLMv2 primitives the NLA exchange needs.
sha2 = { workspace = true }
hmac = "0.12.1"
md-5 = "0.10.6"
# The platform trust store decides whether a certificate is already trusted;
# only an untrusted or changed one becomes a question for the user.
rustls-platform-verifier = "0.7.1"
# CredSSP/NLA, the authentication layer of every current Windows RDP server. It
# implements NTLMv2 and the TSRequest exchange; the protocol client around it is
# ours. Without a NLA path an endpoint that requires Network Level Authentication
# could not be reached at all.
sspi = { version = "0.23.1", default-features = false }
# The subject and issuer of a certificate are shown beside its fingerprint.
x509-parser = "0.18.1"
# Passwords and derived session keys are wiped when the attempt ends.
zeroize = { workspace = true }
# VNC authentication encrypts the server's challenge with the password as a DES
# key; the crate is the one the CredSSP stack already brings in.
des = "0.9.0"
# The extended clipboard carries its text in a zlib stream. flate2's default
# backend is miniz_oxide, so no C compression library joins the build.
flate2 = "1.1.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Networking_WinSock"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["net"] }

[[test]]
name = "native"
path = "../../tests/desktop_native.rs"
