[package]
name = "shellune-ssh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "SSH transport for Shellune: host trust, authentication and a remote PTY."
publish = false

[dependencies]
russh = { workspace = true }
russh-sftp = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
shellune-core = { path = "../core" }
# Managed OpenSSH keys (R1): parsing, generating, exporting and fingerprinting
# Ed25519, ECDSA and RSA keys. Pinned to the exact release russh re-exports as
# `russh::keys::ssh_key`, so a key parsed here is the same crate instance russh
# authenticates with and no copy of it is ever made between the two.
ssh-key = { version = "=0.7.0-rc.11", features = [
    "ecdsa",
    "ed25519",
    "encryption",
    "getrandom",
    "p256",
    "p384",
    "p521",
    "rand_core",
    "rsa",
    "std",
] }
tokio = { workspace = true }
# The per-session X11 cookie is a random value; the UUID generator is the same
# cryptographically secure source the rest of the workspace already uses.
uuid = { workspace = true }
zeroize = { workspace = true }

[features]
# The test doubles the window's tests need: the disposable OpenSSH server harness and
# a session whose events are scripted. It is behind a feature so a release build of
# the application carries none of it.
test-support = []
