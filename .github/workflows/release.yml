# Builds the per-platform artifacts that packaging/ describes and, for a version tag,
# publishes them as a GitHub release.
#
# macOS builds are signed with a fixed self-signed certificate held in the secrets
# APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD and
# APPLE_SIGNING_IDENTITY; a release without them fails. They are not notarised.
# Windows and Linux artifacts are not code-signed.
#
# Every update file is signed for the in-app updater with shellune-sign (crates/update,
# feature release-tools): the setup.exe, the portable zip, the macOS .app.tar.gz and
# the deb each get a <file>.sig. The key is the secret SHELLUNE_UPDATER_KEY (base64
# minisign secret key) with its password in SHELLUNE_UPDATER_KEY_PASSWORD; a run
# without them fails before anything is built. The publish job checks that the key
# matches shellune_update::PUBLIC_KEY, writes latest.json with
# packaging/updater-manifest.py, and publishes it with every file in one release, so a
# release never exists without its manifest.
#
# Release steps: set the version in Cargo.toml, write
# docs/release/<version>-release-notes.md, merge, then push the tag v<version>. The
# version job refuses a tag that does not match Cargo.toml before anything is built.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        name: Read the version and check the tag
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the Cargo.toml version $version"
            exit 1
          fi
          notes="docs/release/$version-release-notes.md"
          if [ ! -f "$notes" ]; then
            echo "::error::$notes is missing"
            exit 1
          fi
      # Checked before any build, like the macOS certificate: every platform job signs
      # its update files, and an unsigned release would be refused by the updater.
      - name: Require the updater signing key
        env:
          SHELLUNE_UPDATER_KEY: ${{ secrets.SHELLUNE_UPDATER_KEY }}
          SHELLUNE_UPDATER_KEY_PASSWORD: ${{ secrets.SHELLUNE_UPDATER_KEY_PASSWORD }}
        run: |
          missing=0
          for name in SHELLUNE_UPDATER_KEY SHELLUNE_UPDATER_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::secret $name is not set; update files are signed for the in-app updater"
              missing=1
            fi
          done
          exit $missing

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release
      - name: Portable bundle
        run: python packaging/windows/make-portable.py --binary target/release/shellune.exe --version ${{ env.VERSION }}
      # PowerShell, not bash: Git Bash rewrites an argument that starts with "/" into a
      # path, which would turn /DVERSION=... into something makensis does not read.
      - name: Installer (NSIS)
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" "/DVERSION=$env:VERSION" packaging\windows\shellune.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The updater installs the setup.exe on an installed copy (started with /S /R) and
      # swaps shellune.exe from the zip on a portable one.
      - name: Sign the update files
        shell: bash
        env:
          SHELLUNE_UPDATER_KEY: ${{ secrets.SHELLUNE_UPDATER_KEY }}
          SHELLUNE_UPDATER_KEY_PASSWORD: ${{ secrets.SHELLUNE_UPDATER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for file in "dist/Shellune-$VERSION-setup.exe" "dist/Shellune-$VERSION-windows-x86_64-portable.zip"; do
            cargo run --release -p shellune-update --features release-tools --bin shellune-sign -- \
              sign "$file" --version "$VERSION"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: shellune-windows-x86_64
          path: |
            dist/Shellune-${{ env.VERSION }}-windows-x86_64-portable.zip
            dist/Shellune-${{ env.VERSION }}-windows-x86_64-portable.zip.sig
            dist/Shellune-${{ env.VERSION }}-setup.exe
            dist/Shellune-${{ env.VERSION }}-setup.exe.sig
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      # Checked before the build, so a release without the certificate fails in seconds
      # instead of after a full build, and never falls back to an ad-hoc signature.
      - name: Require the stable signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
            if [ -z "${!name}" ]; then
              echo "::error::secret $name is not set; macOS releases are signed with a fixed certificate"
              missing=1
            fi
          done
          exit $missing
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release
      - name: App bundle
        run: python3 packaging/macos/make-app-bundle.py --binary target/release/shellune --version "$VERSION"
      # A fixed self-signed identity, not Apple notarisation: every release carries the
      # same signer, so macOS keeps the keychain and privacy permissions granted to an
      # earlier version instead of asking again after each update.
      - name: Sign with the stable certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/shellune.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          certificate="$RUNNER_TEMP/shellune.p12"
          cleanup() {
            rm -f "$certificate"
            security delete-keychain "$keychain" 2>/dev/null || true
          }
          trap cleanup EXIT
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"
          base64 --decode > "$certificate" <<< "$APPLE_CERTIFICATE"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"

          app=dist/Shellune.app
          # Inner Mach-O files first, deepest path first, then the bundle itself: a
          # bundle signature covers what is inside it, so it has to come last.
          find "$app" -type f -print0 | while IFS= read -r -d '' file; do
            if file -b "$file" | grep -q 'Mach-O'; then
              printf '%s\n' "$file"
            fi
          done | awk '{ print length($0) "\t" $0 }' | sort -nr | cut -f2- | while IFS= read -r file; do
            codesign --force --options runtime --keychain "$keychain" --sign "$APPLE_SIGNING_IDENTITY" "$file"
          done
          codesign --force --options runtime --keychain "$keychain" --sign "$APPLE_SIGNING_IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
      - name: Verify the signature
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          app=dist/Shellune.app
          signature=$(codesign --display --verbose=4 "$app" 2>&1)
          echo "$signature"
          if grep -q '^Signature=adhoc$' <<< "$signature"; then
            echo "::error::the app is ad-hoc signed; expected $APPLE_SIGNING_IDENTITY"
            exit 1
          fi
          grep -F -x -q "Authority=$APPLE_SIGNING_IDENTITY" <<< "$signature" \
            || { echo "::error::the app is not signed by $APPLE_SIGNING_IDENTITY"; exit 1; }
          grep -F -x -q "Identifier=com.shellune.Shellune" <<< "$signature" \
            || { echo "::error::the signature does not carry the bundle identifier"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --requirements - "$app"
      # The in-app updater replaces the .app from this archive: Shellune.app at its top,
      # the code signature inside. No AppleDouble files or extended attributes (the
      # updater would not restore them anyway).
      - name: Update archive
        run: |
          set -euo pipefail
          archive="dist/Shellune-$VERSION-macos-arm64.app.tar.gz"
          COPYFILE_DISABLE=1 tar --no-mac-metadata -czf "$archive" -C dist Shellune.app
          tar -tzf "$archive" | head -n 5
          tar -tzf "$archive" | grep -q '^Shellune.app/Contents/MacOS/shellune$' \
            || { echo "::error::$archive does not hold Shellune.app/Contents/MacOS/shellune"; exit 1; }
      - name: Sign the update archive
        env:
          SHELLUNE_UPDATER_KEY: ${{ secrets.SHELLUNE_UPDATER_KEY }}
          SHELLUNE_UPDATER_KEY_PASSWORD: ${{ secrets.SHELLUNE_UPDATER_KEY_PASSWORD }}
        run: |
          cargo run --release -p shellune-update --features release-tools --bin shellune-sign -- \
            sign "dist/Shellune-$VERSION-macos-arm64.app.tar.gz" --version "$VERSION"
      - name: Disk image
        run: python3 packaging/macos/make-dmg.py --app dist/Shellune.app --version "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: shellune-macos-arm64
          path: |
            dist/Shellune-${{ env.VERSION }}-macos-arm64.dmg
            dist/Shellune-${{ env.VERSION }}-macos-arm64.app.tar.gz
            dist/Shellune-${{ env.VERSION }}-macos-arm64.app.tar.gz.sig
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the graphics headers and the deb tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libxcb1-dev pkg-config dpkg-dev
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release
      - name: Deb package
        run: python3 packaging/linux/make-deb.py --binary target/release/shellune --version "$VERSION"
      # The updater never installs the deb (it opens the release page); the signature
      # lets latest.json list it like every other platform.
      - name: Sign the deb
        env:
          SHELLUNE_UPDATER_KEY: ${{ secrets.SHELLUNE_UPDATER_KEY }}
          SHELLUNE_UPDATER_KEY_PASSWORD: ${{ secrets.SHELLUNE_UPDATER_KEY_PASSWORD }}
        run: |
          cargo run --release -p shellune-update --features release-tools --bin shellune-sign -- \
            sign "dist/shellune_${VERSION}_amd64.deb" --version "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: shellune-linux-x86_64
          path: |
            dist/shellune_${{ env.VERSION }}_amd64.deb
            dist/shellune_${{ env.VERSION }}_amd64.deb.sig
          if-no-files-found: error

  publish:
    # Only a version tag publishes; a manual run stops at the artifacts.
    if: github.ref_type == 'tag'
    needs: [version, windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Require the updater signing key
        env:
          SHELLUNE_UPDATER_KEY: ${{ secrets.SHELLUNE_UPDATER_KEY }}
          SHELLUNE_UPDATER_KEY_PASSWORD: ${{ secrets.SHELLUNE_UPDATER_KEY_PASSWORD }}
        run: |
          missing=0
          for name in SHELLUNE_UPDATER_KEY SHELLUNE_UPDATER_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::secret $name is not set; nothing is published"
              missing=1
            fi
          done
          exit $missing
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Signatures from any other key are refused by every installed copy, so a
      # replaced or mistyped secret stops the release here.
      - name: Check the key against the one the app trusts
        env:
          SHELLUNE_UPDATER_KEY: ${{ secrets.SHELLUNE_UPDATER_KEY }}
          SHELLUNE_UPDATER_KEY_PASSWORD: ${{ secrets.SHELLUNE_UPDATER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          trusted=$(sed -n 's/^pub const PUBLIC_KEY: &str = "\(.*\)";$/\1/p' crates/update/src/lib.rs)
          if [ -z "$trusted" ]; then
            echo "::error::PUBLIC_KEY was not found in crates/update/src/lib.rs"
            exit 1
          fi
          actual=$(cargo run --release -p shellune-update --features release-tools --bin shellune-sign -- public-key)
          if [ "$actual" != "$trusted" ]; then
            echo "::error::SHELLUNE_UPDATER_KEY belongs to $actual, but the app trusts $trusted"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # Refuses a missing file, a missing or empty signature, or one for another version.
      - name: Write latest.json
        run: |
          python3 packaging/updater-manifest.py --version "$VERSION" --dist dist \
            --notes-file "docs/release/$VERSION-release-notes.md" --output dist/latest.json
          cat dist/latest.json
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum -- * > SHA256SUMS)
          ls -l dist
          cat dist/SHA256SUMS
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "Shellune $VERSION" \
            --notes-file "docs/release/$VERSION-release-notes.md"
