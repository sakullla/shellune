# Formatting, static analysis and the test suite on the three target platforms.
#
# None of these jobs has been executed: this repository is delivered from a Windows
# machine with no GitHub remote, so the workflow is reviewed configuration, not
# evidence that macOS or Linux builds pass. The Windows row of the matrix mirrors
# the command that was run by hand (see docs/release/).
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
          - name: macos-arm64
            os: macos-latest
          - name: ubuntu-22.04-x86_64
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install the Linux graphics headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libxcb1-dev pkg-config cmake
          # The X11 forwarding tests need a display server to forward to and a client
          # that opens a window; the tests themselves skip when neither is available
          # and say so, so a missing package is reported as a gap and not as a pass.
          sudo apt-get install -y --no-install-recommends xvfb x11-utils x11-apps xauth openssh-server

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features -- --include-ignored
