# Formatting, static analysis and the test suite on the three target platforms.
#
# No native library is built before cargo runs: the RDP and VNC clients are part of
# the shellune-desktop crate and link no third-party protocol library, so a checkout
# and the Rust toolchain are the whole build. ring, the SSH and TLS crypto backend,
# is the only dependency with a C build step of its own.
#
# Pushing a branch under ci/ runs this workflow without touching main.
name: ci

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
          - name: macos-arm64
            os: macos-latest
          - name: ubuntu-22.04-x86_64
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install the Linux graphics headers and a test display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libxcb1-dev pkg-config
          # The X11 forwarding tests need a display server to forward to and a client
          # that opens a window; the tests themselves skip when neither is available
          # and say so, so a missing package is reported as a gap and not as a pass.
          sudo apt-get install -y --no-install-recommends xvfb x11-utils x11-apps xauth openssh-server

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        env:
          # A protocol whose engine the build does not carry must fail the job rather
          # than pass as a row of skips.
          SHELLUNE_REQUIRE_NATIVE: "1"
        run: cargo test --workspace --all-features -- --include-ignored
